name: Autonomous QA

# Nightly autonomous run against booking.com, also callable from CI and on demand.
# Loop: explore -> plan -> execute (smoke circuit breaker, then regression) -> triage -> heal -> report.
on:
  schedule:
    - cron: '17 3 * * *'   # 05:17 Cairo time, off-peak
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [live, sandbox, mock]
        default: live
  workflow_call:
    inputs:
      environment:
        type: string
        default: live

permissions:
  contents: write   # publish reports to the qa-reports branch
  issues: write     # open / update an issue when the verdict is FAIL

jobs:
  agent:
    name: Agent (${{ inputs.environment || 'live' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_ENV: ${{ inputs.environment || 'live' }}
      # Optional secrets: the agent adapts its plan when they are absent.
      DEMAND_TOKEN: ${{ secrets.DEMAND_TOKEN }}
      DEMAND_AFFILIATE_ID: ${{ secrets.DEMAND_AFFILIATE_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run the autonomous QA agent
        id: agent
        continue-on-error: true
        run: mvn -B -ntp test-compile exec:java -Dqa.env="$QA_ENV"

      - name: Read verdict
        id: verdict
        if: always()
        run: |
          v=$(cat target/autonomous/verdict.txt 2>/dev/null || echo ERROR)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Verdict: $v"

      - name: Allure HTML report
        if: always()
        run: mvn -B -ntp -q allure:report || echo "Allure report generation skipped"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-${{ env.QA_ENV }}-${{ github.run_id }}
          path: |
            target/autonomous
            target/cucumber
            target/site/allure-maven-plugin
          retention-days: 30

      - name: Publish report to the qa-reports branch (living observation log)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.verdict.outputs.value }}
        run: |
          set -e
          [ -f target/autonomous/report.md ] || { echo "no report to publish"; exit 0; }
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/pub
          if git clone -q --depth 1 --branch qa-reports "$remote" /tmp/pub 2>/dev/null; then :; else
            mkdir -p /tmp/pub && cd /tmp/pub && git init -q -b qa-reports && git remote add origin "$remote" && cd - >/dev/null
          fi
          mkdir -p "/tmp/pub/$QA_ENV/history"
          cp target/autonomous/report.md "/tmp/pub/$QA_ENV/latest.md"
          cp target/autonomous/report.json "/tmp/pub/$QA_ENV/latest.json"
          cp target/autonomous/report.md "/tmp/pub/$QA_ENV/history/$(date -u +%Y%m%dT%H%M%SZ)-$VERDICT.md"
          if [ -d target/autonomous/healing ]; then rm -rf "/tmp/pub/$QA_ENV/healing"; cp -r target/autonomous/healing "/tmp/pub/$QA_ENV/healing"; fi
          cd /tmp/pub
          git config user.name "autonomous-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "QA report ($QA_ENV): $VERDICT [run ${GITHUB_RUN_ID}]" || { echo "nothing to commit"; exit 0; }
          git push -q origin qa-reports

      - name: Open or update an issue when the verdict is FAIL
        if: steps.verdict.outputs.value == 'FAIL' && github.event_name != 'pull_request' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Autonomous QA FAIL on ${QA_ENV}"
          gh label create autonomous-qa --color B60205 --description "Opened by the autonomous QA agent" --force
          num=$(gh issue list --state open --label autonomous-qa --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file target/autonomous/report.md
          else
            gh issue create --title "$title" --label autonomous-qa --body-file target/autonomous/report.md
          fi

      - name: Fail the job on a FAIL verdict
        if: always()
        run: |
          case "${{ steps.verdict.outputs.value }}" in
            FAIL|ERROR) echo "::error::Autonomous QA verdict ${{ steps.verdict.outputs.value }}"; exit 1 ;;
            INCONCLUSIVE) echo "::warning::Autonomous QA verdict INCONCLUSIVE (see report: surfaces could not be exercised)";;
            *) echo "Verdict PASS";;
          esac
