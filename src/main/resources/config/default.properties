# ---------------------------------------------------------------------------
# Defaults shared by every environment. Override any key with -Dkey=value
# or with an environment variable (dots -> underscores, upper case).
# Secrets (demand.token, demand.affiliate.id, anthropic.api.key) are NEVER
# committed: provide them as env vars / CI secrets.
# ---------------------------------------------------------------------------

web.base.url=https://www.booking.com
autocomplete.base.url=https://accommodations.booking.com
demand.base.url=https://demandapi.booking.com/3.1

booking.language=en-gb
booking.currency=EUR
booking.booker.country=eg

# A real-browser user agent: booking.com treats unknown agents as bots.
http.user.agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
http.connect.timeout.ms=10000
http.read.timeout.ms=30000

# Service level objectives used by latency checks (milliseconds)
sla.web.ms=6000
sla.api.ms=3000

# skip -> a bot-protection challenge marks the check SKIPPED [ENV_BLOCKED] (not a product bug)
# fail -> treat a challenge as a failure (use when running from an allow-listed network)
guard.bot.block.policy=skip

# Only failures triaged as TRANSIENT (network, 429, 502/503/504) are retried
retry.transient.max=2

# Autonomous agent
agent.smoke.min.pass.rate=0.5
agent.output.dir=target/autonomous
agent.heal.accept=false

# Optional LLM advisor (advisory only, never changes verdicts)
llm.enabled=true
llm.model=claude-sonnet-5-5
llm.endpoint=https://api.anthropic.com/v1/messages
llm.max.tokens=1500
